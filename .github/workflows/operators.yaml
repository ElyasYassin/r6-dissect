name: Operators

# Compares our operator list with Ubisoft's website. New operators are released every season,
# so this runs on a schedule instead of blocking unrelated pull requests.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  operators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compare operators with Ubisoft
        env:
          R6_DISSECT_NETWORK_TESTS: "1"
        run: go test -v -run 'Test_operators' ./dissect/test/
